services:
  # TiDB in standalone mode — enough for local development. Production points at
  # TiDB Cloud, where only the connection string differs.
  #
  # `--path` gives unistore a directory to persist into, and the named volume
  # keeps it across `docker compose down` and Docker Desktop restarts. Without
  # both, every restart came back with an empty database.
  tidb:
    image: pingcap/tidb:v8.1.0
    container_name: sva_tidb
    restart: unless-stopped
    command:
      - --store=unistore
      - --path=/tidb-data
      - --host=0.0.0.0
    volumes:
      - tidb_data:/tidb-data
    ports:
      - "4100:4000"
    healthcheck:
      test: ["CMD-SHELL", "/tidb-server -V > /dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  tidb_data:
